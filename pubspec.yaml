name: airon_bot
description: "AI Chat App - Flutter Cross-Platform (Android/iOS/Chrome)"
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  cloud_functions: ^5.6.2

  # Navigation
  go_router: ^14.8.1

  # HTTP / IA
  http: ^1.2.1

  # UI
  flutter_markdown: ^0.7.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0

  # Auth Google
  google_sign_in: ^6.2.2

  # Voix
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

  # Fichiers
  file_picker: ^8.1.6
  image_picker: ^1.1.2

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.1

  # Sécurité
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

  # Monétisation
  google_mobile_ads: ^5.2.0
  purchases_flutter: ^6.30.1

  # Utilitaires
  uuid: ^4.4.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.1
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_gen_runner: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
