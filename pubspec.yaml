name: airon_bot
description: AironBot - AI Chat Assistant with DeepSeek-V3 and Chrome Extension sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  firebase_messaging: ^16.2.0

  # Authentication
  google_sign_in: ^6.2.1

  # AI & HTTP
  http: ^1.2.0
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Serialization & Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.3.5

  # Monetization
  google_mobile_ads: ^5.3.1
  purchases_flutter: ^8.0.0

  # Voice
  speech_to_text: ^7.1.0
  flutter_tts: ^4.2.0
  record: ^6.0.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.0
  web_socket_channel: ^2.4.0

  # Storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  firebase_storage: ^13.3.0

  # Images & Files
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0+1
  archive: ^3.4.10
  pdf: ^3.11.1
  excel: ^4.0.2
  xml: ^6.5.0

  # UI & Utilities
  flutter_markdown: ^0.7.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  uuid: ^4.5.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  url_launcher: ^6.3.0

  # Security
  crypto: ^3.0.5

  # Deep Links
  app_links: ^6.4.0

  # Environment
  flutter_dotenv: ^5.2.1

  # Location
  geolocator: ^13.0.0

  # Platform detection
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/icons/
    - .env
