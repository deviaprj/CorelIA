name: airon_bot
description: AironBot - AI Chat Assistant with DeepSeek-V3 and Chrome Extension sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.6.8
  firebase_messaging: ^14.7.9

  # Authentication
  google_sign_in: ^6.2.1

  # AI & HTTP
  http: ^1.2.0

  # Monetization
  google_mobile_ads: ^4.1.0
  purchases_flutter: ^6.21.0

  # Voice
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.3

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Utilities
  flutter_markdown: ^0.6.18
  share_plus: ^7.2.1
  intl: ^0.19.0
  uuid: ^4.3.3

  # Platform detection
  web: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^5.2.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/icons/
