name: corel_ia
description: CorelIA — assistant IA mobile (chat, recherche Internet, abonnement Free/Full)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # État
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Firebase (authentification + stockage des conversations)
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Authentification
  google_sign_in: ^6.2.1

  # Réseau & IA
  http: ^1.2.0
  dio: ^5.7.0

  # Abonnement (Agent IA Full)
  purchases_flutter: ^8.0.0

  # Pièces jointes
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.0.0+1
  archive: ^3.4.10
  pdf: ^3.11.1
  excel: ^4.0.2
  xml: ^6.5.0

  # UI & utilitaires
  flutter_markdown: ^0.7.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  uuid: ^4.5.0

  # Stockage local
  shared_preferences: ^2.3.0

  # Sécurité (hash cache de recherche)
  crypto: ^3.0.5

  # Variables d'environnement
  flutter_dotenv: ^5.2.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/icons/
    # .env n'est JAMAIS embarqué : les clés arrivent via --dart-define
    # (évite d'exposer les secrets payants dans l'APK).
