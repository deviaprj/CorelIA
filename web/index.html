<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <base href="$FLUTTER_BASE_HREF">
  <meta name="viewport" content="width=420, initial-scale=1.0" />
  <title>Corely</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Popup dimensions : 420×600. Side panel = 100% */
      width: 420px;
      height: 600px;
      overflow: hidden;
      background-color: #1a1a2e;
    }

    /* Mode side panel : prendre toute la hauteur */
    @media (min-height: 601px) {
      html, body {
        width: 100%;
        height: 100%;
      }
    }

    /* Écran de chargement Flutter */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: #1a1a2e;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(108, 99, 255, 0.3);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <!-- Web Speech API bridge (avant Flutter) -->
  <script src="speech_bridge.js"></script>

  <!-- Extension bridge (chrome.runtime → CustomEvents) -->
  <script src="extension_bridge.js"></script>

  <!-- Browser actions bridge (Flutter → browser commands) -->
  <script src="browser_actions.js"></script>

  <!-- Corely init : CSP inline script interception, dispatchCustomEvent, diagnostics -->
  <!-- Externalisé pour respecter CSP Manifest V3 (pas de scripts inline) -->
  <script src="corely_init.js"></script>

  <!-- Bootstrap Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
